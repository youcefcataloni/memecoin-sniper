name: Memecoin Sniper Agent

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies and Xvfb
        run: |
          pip install playwright requests
          playwright install chromium --with-deps
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run AI Agent with virtual screen
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: xvfb-run python main.py

      - name: Upload Trench Radar Screenshot
        uses: actions/upload-artifact@v4
        with:
          name: trench-screenshot
          path: trench_screenshot.png
